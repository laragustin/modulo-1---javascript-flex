<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cierre de Actas — Simulador docente</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script defer src="js/datos.js"></script>
  <script defer src="js/interfaz.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <img src="assets/img/logo.svg" alt="Logo de Cierre de Actas" class="logo" width="60" height="60">
      <div>
        <h1>Cierre de Actas</h1>
        <p class="subtitulo">Simulador docente: cargá las notas de tus materias, armá el acta y confirmá el cierre de cursada.</p>
      </div>
    </header>

    <ol class="pasos" aria-label="Pasos del circuito">
      <li><span>1</span> Revisá tus materias</li>
      <li><span>2</span> Cargá o modificá notas</li>
      <li><span>3</span> Agregalas al acta</li>
      <li><span>4</span> Confirmá el cierre</li>
    </ol>

    <p id="estado-carga" class="estado-carga" role="status" aria-live="polite"></p>

    <div id="aviso-recordatorio" class="aviso oculto" role="status" aria-live="polite">
      <p id="aviso-texto"></p>
      <button type="button" id="btn-cerrar-aviso" class="btn btn-secundario btn-chico" aria-label="Cerrar aviso">✕</button>
    </div>

    <div class="layout">
      <main class="columna-principal">
        <section class="panel">
          <h2>Agregar materia</h2>
          <form id="form-materia" class="formulario formulario-fila">
            <label>
              Nombre
              <input type="text" id="input-nombre" placeholder="Ej: Geografía" required>
            </label>
            <label>
              Categoría
              <input type="text" id="input-categoria" list="sugerencias-categorias" placeholder="Ej: Humanidades" required>
              <datalist id="sugerencias-categorias"></datalist>
            </label>
            <button type="submit" class="btn btn-primario">+ Agregar</button>
          </form>
        </section>

        <section class="panel panel-herramientas">
          <label class="busqueda">
            Buscar materia
            <input type="search" id="input-busqueda" placeholder="Escribí para filtrar…" autocomplete="off">
          </label>
          <label class="filtro-categoria">
            Categoría
            <select id="select-categoria">
              <option value="todas">Todas</option>
            </select>
          </label>
          <button type="button" id="btn-reiniciar" class="btn btn-peligro">Reiniciar simulador</button>
        </section>

        <section class="panel">
          <div class="lista-cabecera">
            <h2>Mis materias</h2>
            <span id="contador-materias" class="meta">0 materias</span>
          </div>
          <div id="contenedor-materias" class="contenedor-materias"></div>
        </section>
      </main>

      <aside class="columna-lateral">
        <section class="panel panel-acta">
          <h2>Acta en curso</h2>
          <div id="contenedor-acta"></div>
          <div id="resumen-acta"></div>
          <div class="acciones-acta">
            <button type="button" id="btn-vaciar-acta" class="btn btn-secundario" disabled>Vaciar acta</button>
            <button type="button" id="btn-confirmar-acta" class="btn btn-primario" disabled>Confirmar cierre</button>
          </div>
        </section>

        <section class="panel">
          <div class="lista-cabecera">
            <h2>Actas cerradas</h2>
            <button type="button" id="btn-vaciar-historial" class="btn btn-peligro btn-chico" disabled>Vaciar historial</button>
          </div>
          <div id="contenedor-historial"></div>
        </section>
      </aside>
    </div>
  </div>
</body>
</html>
